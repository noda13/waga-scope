name: Collect Static Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-static-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # JQUANTS_API_KEY シークレットが設定されていれば jquants モード、なければ csv (50銘柄サンプル)
      DATA_PROVIDER: ${{ secrets.JQUANTS_API_KEY != '' && 'jquants' || 'csv' }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -C backend exec prisma generate

      - name: Generate static JSON
        run: pnpm exec tsx scripts/collect-static.ts

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update static data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
